name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  simulate:
    name: simulate (Icarus)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Icarus Verilog and numpy
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends iverilog
          python3 -m pip install --upgrade pip
          python3 -m pip install -r model/requirements.txt
          iverilog -V | head -1

      # Proves the ROMs burned into the FPGA build still match the reference
      # model. Without this, the board could be self-testing against stale
      # expectations and still light its PASS LED.
      - name: Committed FPGA ROMs match the model
        run: make check-roms

      # A wrong pin assignment compiles, closes timing, programs, and then does
      # nothing at all. Both boards are diffed against their vendor pin tables
      # so it fails loudly here instead of silently on a desk.
      - name: Board pins match the vendor references
        run: make check-pins

      - name: Run all simulations
        run: make sim

  lint:
    name: structural check (Yosys)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Yosys
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends yosys
          yosys -V

      # Catches the failures that simulate cleanly and then bite in the vendor
      # tool: inferred latches, undriven and multiply-driven nets, hierarchy
      # that does not elaborate. Run once per array geometry, because only 8x8
      # is elaborated by the vendor builds -- a latch inferred only at 4x8 would
      # otherwise go unnoticed.
      - name: Elaborates cleanly at every geometry
        run: make lint

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: yosys-cell-stats
          path: syn/yosys/stat_*.txt
          if-no-files-found: ignore

  formal:
    name: bounded model check (Yosys sat)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Same package as the lint job. `sat` is built into yosys, so proving
      # these properties needs no SMT solver, no SymbiYosys and no license.
      - name: Install Yosys
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends yosys
          yosys -V

      # Simulation covers the stimulus somebody thought to write. This covers
      # every input sequence within the bound. --self-test then re-runs the
      # proof against a deliberately broken copy and fails if it still passes,
      # so the job cannot go green while checking nothing.
      - name: Backpressure holds, and the proof can still fail
        run: make formal

  gatelevel:
    name: gate-level simulation (Yosys + Icarus)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Yosys, Icarus Verilog and numpy
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends yosys iverilog
          python3 -m pip install --upgrade pip
          python3 -m pip install -r model/requirements.txt

      # Synthesises the RTL to gates and re-runs the same self-checking
      # testbench against the netlist, against the same golden vectors. Catches
      # RTL that simulates one way and synthesises another, and X propagation
      # from reset that `logic` in RTL is forgiving about. --self-test then
      # proves the flow can still fail, using a truncating requantiser.
      - name: Gates match the model, and the check can still fail
        run: make gatelevel
